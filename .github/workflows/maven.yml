name: API Test Automation Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run REST Assured Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permissions for Maven Wrapper (if present)
        run: chmod +x mvnw || true

      - name: Run TestNG Suite with Maven
        run: mvn clean test

      - name: Upload ExtentReport HTML Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-API-Test-Report
          path: target/reports/ExtentReport.html
          retention-days: 30

      - name: Upload Log4j Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: target/logs/
          retention-days: 14
